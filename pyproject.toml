[project]
name = "vp-core"
version = "1.3.0"
description = "Shared infrastructure for virtual-pathway packages: splits, featurisers, metrics, evaluation protocols and the version manifest schema."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Sagace Labs" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "rdkit>=2024.3.1",
    "joblib>=1.3",
    "xgboost>=2.0",
]

[project.urls]
Source = "https://github.com/Sagace-Labs/vp-core"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vp_core"]
